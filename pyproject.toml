[project]
name = "trading-system"
version = "0.0.0"
description = "Intraday agentic trading system — research-first platform for U.S. equity day trading."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-runtime",
    "trading-schemas",
    "trading-market-data",
    "trading-features",
    "trading-alpha-dsl",
    "trading-risk",
    "trading-oms",
    "trading-brokers",
    "trading-backtest",
    "trading-portfolio",
    "trading-validation",
    "trading-memory",
    "trading-cli",
    "trading-api",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "pytest>=8.3",
    "hypothesis>=6.115",
    "pyarrow-stubs>=20.0.0.20260819",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
trading-runtime = { workspace = true }
trading-schemas = { workspace = true }
trading-market-data = { workspace = true }
trading-features = { workspace = true }
trading-alpha-dsl = { workspace = true }
trading-risk = { workspace = true }
trading-oms = { workspace = true }
trading-brokers = { workspace = true }
trading-backtest = { workspace = true }
trading-portfolio = { workspace = true }
trading-validation = { workspace = true }
trading-memory = { workspace = true }
trading-cli = { workspace = true }
trading-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# --------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "tools", "tests"]
# Generated by tools/codegen.py. Excluded from lint and format because ruff
# rewriting them would make `codegen --check` report drift against its own
# output. They stay under mypy --strict, which is the reason they are generated
# to a file at all.
extend-exclude = ["**/_generated/**"]

[tool.ruff.lint]
select = [
    "F", "E", "W",      # pyflakes, pycodestyle
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "A",                # builtin shadowing
    "C4",               # comprehensions
    "DTZ",              # flake8-datetimez — D3: no naive datetimes
    "T20",              # no print() in library code
    "PT",               # pytest style
    "RET", "SIM", "TID", "PTH",
    "NPY",              # numpy legacy random etc.
    "RUF",
]
ignore = [
    "E501",    # line length is formatter's job
    "B008",    # FastAPI Depends() in defaults
    "RET504",  # named return values aid debugging in numeric code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"tools/**" = ["T20"]
"apps/cli/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# Types
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = [
    "packages/runtime/src", "packages/schemas/src", "packages/market_data/src",
    "packages/features/src", "packages/alpha_dsl/src", "packages/risk/src",
    "packages/oms/src", "packages/brokers/src", "packages/backtest/src",
    "packages/portfolio/src", "packages/validation/src", "packages/memory/src",
    "apps/cli/src", "apps/api/src",
]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "tools.*"]
disallow_untyped_defs = false

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode: the test layers in §35 are directories, not packages, so
# tests/unit/test_money.py and tests/property/test_money.py share a module
# basename. The default prepend mode resolves that by basename and collides.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: return math, windows, timestamp comparisons, fee calculations (§35)",
    "property: no-future-read, PnL conservation, idempotent retries (§35)",
    "golden: known tiny market stream with exact expected output (§35)",
    "differential: two fill models on one engine must agree where assumptions overlap",
    "mutation: deliberately injected defects the suite must detect (§35)",
    "integration: feed, feature clock, risk, OMS, broker sandbox (§35)",
    "chaos: disconnects, timeouts, stale feeds, clock drift (§35)",
    "statistical: null labels, random strategies, bootstrap calibration (§35)",
    "security: secrets, authorization, artifact signatures (§35)",
    "docker: requires a working Docker daemon",
]
