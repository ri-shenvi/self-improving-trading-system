# CI runs `make verify` and nothing else, so a green local run and a green
# pipeline cannot diverge. Adding a check here without adding it to the Makefile
# would make the pipeline unreproducible locally, which is the first step toward
# a pipeline nobody trusts.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The determinism envelope (D9). Declared at job scope so the variables are set
# before any interpreter starts — BLAS and OpenMP freeze their thread counts on
# first import, so a later assignment would be inert. The authoritative list is
# trading.runtime.determinism.PINNED_ENV, and tests/unit/test_determinism_envelope_declarations.py
# asserts this block, the Makefile and the Dockerfile declare exactly that set.
env:
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  POLARS_MAX_THREADS: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install

      # --frozen fails rather than re-resolving. A pipeline that quietly
      # upgraded a transitive dependency would be testing an environment no
      # experiment was ever run in.
      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Verify
        run: make verify

  # Separate job because it needs a service the development environment does not
  # have. `make verify` stays the single local entry point; this runs the layer
  # that genuinely cannot, against a container configured identically to
  # infra/docker/compose.yaml -- if the two drift, the local stack stops
  # predicting CI.
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: trading_research
            # UTF8 encoding with C collation. These are separate settings and
            # conflating them is a real hazard: LANG=C alone makes initdb choose
            # SQL_ASCII, which is not an encoding but the absence of one -- it
            # accepts any byte sequence unvalidated, so text written as UTF-8 can
            # come back mojibake. C collation is what we actually want, for sort
            # order that does not depend on the host's locale.
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
          LANG: C
          LC_ALL: C
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d trading_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRADING_TEST_DSN: postgresql://research:research@localhost:5432/trading_research
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Apply migrations and verify the schema
        run: uv run pytest -m postgres -v
