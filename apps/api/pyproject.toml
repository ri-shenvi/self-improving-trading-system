[project]
name = "trading-api"
version = "0.0.0"
description = "FastAPI control and query surface (§38)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-memory",
    "trading-risk",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
