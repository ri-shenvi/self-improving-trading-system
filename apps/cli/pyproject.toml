[project]
name = "trading-cli"
version = "0.0.0"
description = "Operator and researcher command line."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-runtime",
    "trading-schemas",
    "trading-market-data",
    "trading-features",
    "trading-alpha-dsl",
    "trading-risk",
    "trading-oms",
    "trading-brokers",
    "trading-backtest",
    "trading-portfolio",
    "trading-validation",
    "trading-memory",
    "typer>=0.12",
]

[project.scripts]
trading = "trading.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
