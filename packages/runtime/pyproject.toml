[project]
name = "trading-runtime"
version = "0.0.0"
description = "Determinism envelope: seeding, environment pinning, build fingerprints."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
