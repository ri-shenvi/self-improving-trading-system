[project]
name = "trading-brokers"
version = "0.0.0"
description = "The BrokerAdapter seam. SimBroker and the Alpaca paper adapter."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-oms",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
