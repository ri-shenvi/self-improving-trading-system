[project]
name = "trading-features"
version = "0.0.0"
description = "Versioned causal feature registry and the sanctioned point-in-time join."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-market-data",
    "polars>=1.9",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
