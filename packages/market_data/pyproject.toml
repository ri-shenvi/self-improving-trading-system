[project]
name = "trading-market-data"
version = "0.0.0"
description = "Vendor connectors, normalization, snapshots and data-quality gates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "polars>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
