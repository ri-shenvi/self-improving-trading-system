[project]
name = "trading-risk"
version = "0.0.0"
description = "Pre-trade checks and continuous limits with closed reason codes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
