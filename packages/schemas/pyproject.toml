[project]
name = "trading-schemas"
version = "0.0.0"
description = "Frozen Pydantic and Arrow contracts. Every on-disk format embeds these."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-runtime",
    "pydantic>=2.9",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
