[project]
name = "trading-validation"
version = "0.0.0"
description = "Walk-forward, purge/embargo, robustness attacks, DSR and PBO."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-backtest",
    "numpy>=2.1",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
