[project]
name = "trading-memory"
version = "0.0.0"
description = "Experiment registry, family trial accounting and holdout auditing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
