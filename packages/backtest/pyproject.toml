[project]
name = "trading-backtest"
version = "0.0.0"
description = "Event clock, engine, fill models, accounting and cost decomposition."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-features",
    "trading-risk",
    "trading-oms",
    "trading-brokers",
    "polars>=1.9",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
