[project]
name = "trading-oms"
version = "0.0.0"
description = "Pure order state machine, idempotent client order IDs, reconciliation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
