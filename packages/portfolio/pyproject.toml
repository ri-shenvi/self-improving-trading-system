[project]
name = "trading-portfolio"
version = "0.0.0"
description = "Forecast scaling and the signal-to-intent seam."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
