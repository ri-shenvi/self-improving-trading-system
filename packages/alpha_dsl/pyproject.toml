[project]
name = "trading-alpha-dsl"
version = "0.0.0"
description = "Alpha DSL parser, validator and compiler with the static leakage report."
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-schemas",
    "trading-features",
    "lark>=1.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
